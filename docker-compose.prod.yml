services:
  postgres_db:
    image: postgres:15
    container_name: postgres_db
    restart: always
    env_file:
      - ./.env
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_PORT: ${POSTGRES_PORT}
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build:
      context: ./backend
    container_name: backend_app
    restart: always
    depends_on:
      - postgres_db
    env_file:
      - ./backend/.env
    ports:
      - "127.0.0.1:3000:3000"

  frontend:
    build:
      context: ./frontend
      args:
        REACT_APP_API_URL: https://arepasauripos.click
    container_name: frontend_app
    restart: always
    depends_on:
      - backend
    ports:
      - "127.0.0.1:3001:3000"

volumes:
  postgres_data:
